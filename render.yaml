services:
  - type: web
    name: interview-pressure-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        value: "https://interview-pressure-frontend.onrender.com"

  - type: web
    name: interview-pressure-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://interview-pressure.onrender.com"
      - key: NODE_ENV
        value: "production"
